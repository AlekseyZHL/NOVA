<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="NOVA Wallet — мультичейн-кошелёк в Telegram без сид-фразы">
  <title>NOVA Wallet — мультичейн без сид-фразы</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23070b14'/%3E%3Cpath d='M16 46V18l32 28V18' stroke='url(%23g)' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div id="app" class="app-shell">
    <div id="boot" class="boot">
      <div class="boot-logo">N</div>
      <div class="boot-title">NOVA<span>Wallet</span></div>
      <div class="boot-sub" id="boot-status">Создаём ваш кошелёк…</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-note" id="boot-note">Шифрование · 6 сетей · без сид-фразы</div>
    </div>

    <header id="header" class="header hidden"></header>
    <main id="main" class="main hidden">
      <section id="view-home" class="view"></section>
      <section id="view-swap" class="view hidden"></section>
      <section id="view-activity" class="view hidden"></section>
      <section id="view-security" class="view hidden"></section>
      <section id="view-profile" class="view hidden"></section>
    </main>
    <nav id="nav" class="nav hidden"></nav>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
