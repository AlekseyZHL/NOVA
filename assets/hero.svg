<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="NOVA Wallet — seedless multichain wallet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#10132c"/>
      <stop offset="1" stop-color="#071a2b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle cx="930" cy="70" r="320" fill="url(#glow1)"/>
  <circle cx="180" cy="380" r="300" fill="url(#glow2)"/>

  <!-- logo mark -->
  <g transform="translate(96,96)">
    <rect width="132" height="132" rx="34" fill="#0c1024" stroke="url(#brand)" stroke-width="2"/>
    <path d="M40 96V36l52 60V36" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="260" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#f5f7ff" letter-spacing="-1">NOVA<tspan fill="url(#brand)">Wallet</tspan></text>
  <text x="264" y="212" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#aab4d4">Seedless multichain wallet · Telegram Mini App</text>

  <!-- testnet badge -->
  <g transform="translate(264,238)">
    <rect width="196" height="36" rx="18" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-opacity="0.55"/>
    <circle cx="20" cy="18" r="5" fill="#ffcf5c"/>
    <text x="34" y="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#d9cfff" letter-spacing="1.4">TESTNET · UNAUDITED</text>
  </g>

  <!-- chain chips -->
  <g transform="translate(96,286)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#dbe2ff">
    <g><rect width="146" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#7b8cff"/><text x="38" y="25">Ethereum</text></g>
    <g transform="translate(156,0)"><rect width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#3b82f6"/><text x="38" y="25">Base</text></g>
    <g transform="translate(286,0)"><rect width="146" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#28a0f0"/><text x="38" y="25">Arbitrum</text></g>
    <g transform="translate(442,0)"><rect width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#a377f7"/><text x="38" y="25">Polygon</text></g>
    <g transform="translate(592,0)"><rect width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#f7931a"/><text x="38" y="25">Bitcoin</text></g>
    <g transform="translate(734,0)"><rect width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.1"/><circle cx="22" cy="20" r="8" fill="#14f195"/><text x="38" y="25">Solana</text></g>
  </g>

  <!-- right decorative orbit -->
  <g transform="translate(990,210)" fill="none" stroke="url(#brand)" stroke-opacity="0.35">
    <ellipse rx="150" ry="58" stroke-width="1.5"/>
    <ellipse rx="150" ry="58" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse rx="150" ry="58" stroke-width="1.5" transform="rotate(120)"/>
    <circle r="9" fill="#22d3ee" stroke="none"/>
  </g>
</svg>
