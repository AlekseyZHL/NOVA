# ⚠️ TESTNET ONLY. Do not expose to the internet without TLS, rate limiting
# and an audit. See docs/DEPLOYMENT.md.
services:
  nova:
    build: .
    image: nova-wallet:1.0.1
    container_name: nova-wallet
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ALLOW_MAINNET: "false"
      DEMO_AUTH: "${DEMO_AUTH:-true}"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      WEBAPP_URL: "${WEBAPP_URL:-http://localhost:3000}"
      VAULT_KEY: "${VAULT_KEY:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      PER_TX_LIMIT_USD: "${PER_TX_LIMIT_USD:-250}"
      DAILY_LIMIT_USD: "${DAILY_LIMIT_USD:-1000}"
    volumes:
      - nova-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  nova-data:
