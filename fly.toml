# Fly.io — https://fly.io/docs/reference/configuration/
# NOTE: VAULT_KEY / SESSION_SECRET are generated into the volume on first boot.
# Set them explicitly via `fly secrets set` (64 hex chars each) for production.
app = "nova-wallet"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  ALLOW_MAINNET = "false"
  DEMO_AUTH = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "nova_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
