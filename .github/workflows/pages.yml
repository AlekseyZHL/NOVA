name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "favicon.svg"
      - "og-image.svg"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The landing page is a single self-contained index.html at the repo root,
      # plus two SVGs. .nojekyll makes it work with BOTH Pages modes:
      #   - "Deploy from a branch" (Jekyll disabled, root index.html served as-is)
      #   - "GitHub Actions"       (the staged artifact below is published)
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html favicon.svg og-image.svg _site/
          touch _site/.nojekyll
          ls -lh _site/

      # If Pages is not enabled at all, skip the deploy instead of a red build.
      - name: Check whether GitHub Pages is enabled
        id: pages
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages API returned HTTP $code"
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Enable it in Settings → Pages, then re-run this workflow."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.pages.outputs.enabled != 'true'
        run: echo "Pages is not enabled yet — deploy skipped. Nothing is broken."

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
